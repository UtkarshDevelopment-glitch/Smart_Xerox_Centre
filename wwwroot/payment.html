
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Smart Xerox Centre - Payment</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .payment-container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #222;
        }

        p {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #3399cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

            button:disabled {
                background: #999;
                cursor: not-allowed;
            }

        pre {
            margin-top: 20px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="payment-container">

        <h2>Smart Xerox Centre</h2>

        <p>Complete your Xerox order payment.</p>

        <label>Order ID:</label>

        <input type="number"
               id="orderId"
               value="6"
               min="1" />

        <label>Session Token:</label>

        <input type="password"
               id="sessionToken"
               placeholder="Enter Customer Session Token" />

        <button type="button"
                id="payButton"
                onclick="startPayment()">
            Pay Now
        </button>

        <pre id="result">Waiting for payment...</pre>

    </div>

    <script>

        async function startPayment() {

            const orderId = Number(
                document.getElementById("orderId").value
            );

            const sessionToken =
                document.getElementById("sessionToken").value.trim();

            const result =
                document.getElementById("result");

            const payButton =
                document.getElementById("payButton");

            if (!orderId || orderId <= 0 || !sessionToken) {

                alert("Order ID and Session Token are required.");

                return;
            }

            if (typeof Razorpay === "undefined") {

                result.textContent =
                    "Razorpay Checkout SDK could not be loaded.";

                return;
            }

            payButton.disabled = true;

            result.textContent =
                "Creating Razorpay Order...";

            try {

                // STEP 1: CREATE / GET EXISTING RAZORPAY ORDER

                const response = await fetch("/api/Payment/create", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json",
                        "X-Session-Token": sessionToken
                    },

                    body: JSON.stringify({
                        orderId: orderId
                    })

                });

                const data = await response.json();

                if (!response.ok) {

                    throw new Error(
                        data.message || "Payment creation failed."
                    );

                }

                if (!data.keyId || !data.razorpayOrderId) {

                    throw new Error(
                        "Razorpay Key ID or Order ID is missing."
                    );

                }

                if (!data.amount || data.amount <= 0) {

                    throw new Error(
                        "Invalid payment amount."
                    );

                }

                result.textContent =
                    "Razorpay Order Ready.\nOpening Checkout...";

                // STEP 2: RAZORPAY CHECKOUT OPTIONS

                const options = {

                    key: data.keyId,

                    amount: data.amount,

                    currency: data.currency,

                    name: data.name,

                    description: data.description,

                    order_id: data.razorpayOrderId,

                    handler: async function (paymentResponse) {

                        result.textContent =
                            "Verifying payment...";

                        try {

                            // STEP 3: VERIFY PAYMENT FROM BACKEND

                            const verifyResponse = await fetch(
                                "/api/Payment/verify",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type": "application/json",
                                        "X-Session-Token": sessionToken
                                    },

                                    body: JSON.stringify({

                                        paymentId: data.paymentId,

                                        razorpayOrderId:
                                            paymentResponse.razorpay_order_id,

                                        razorpayPaymentId:
                                            paymentResponse.razorpay_payment_id,

                                        razorpaySignature:
                                            paymentResponse.razorpay_signature

                                    })
                                }
                            );

                            const verifyData =
                                await verifyResponse.json();

                            if (!verifyResponse.ok) {

                                throw new Error(
                                    verifyData.message ||
                                    "Payment verification failed."
                                );

                            }

                            result.textContent =
                                "PAYMENT VERIFICATION RESPONSE\n\n" +
                                JSON.stringify(
                                    verifyData,
                                    null,
                                    2
                                );

                        }
                        catch (error) {

                            result.textContent =
                                "Verification Error:\n" + error.message;

                        }
                        finally {

                            payButton.disabled = false;

                        }

                    },

                    theme: {
                        color: "#3399cc"
                    },

                    modal: {

                        ondismiss: function () {

                            result.textContent =
                                "Payment Checkout Closed.";

                            payButton.disabled = false;

                        }

                    }

                };

                // STEP 4: OPEN RAZORPAY CHECKOUT

                const checkout = new Razorpay(options);

                // STEP 5: PAYMENT FAILED EVENT

                checkout.on("payment.failed", function (response) {

                    result.textContent =
                        "PAYMENT FAILED\n\n" +
                        JSON.stringify(
                            response.error,
                            null,
                            2
                        );

                    payButton.disabled = false;

                });

                checkout.open();

            }
            catch (error) {

                result.textContent =
                    "ERROR:\n" + error.message;

                payButton.disabled = false;

            }

        }

    </script>

</body>
</html>
